---
# Publish modist to PyPI via OIDC trusted publishing whenever a v*.*.* tag is
# pushed (typically by creating a GitHub release). The file MUST be named
# workflow.yml -- this matches the pypi.org trusted-publisher registration.
name: Python package
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv publish --trusted-publishing always

---
# Deploy the standalone client-side bundle (dist/modist.js) and the showcase
# (site/index.html) to GitHub Pages whenever a v*.*.* tag is pushed.
# - https://williambdean.github.io/modist/index.html         (showcase)
# - https://williambdean.github.io/modist/latest/modist.js   (unversioned bundle)
# Both github.io and the pinned jsDelivr copies (cd "/dist/modist.js" on the
# tag) serve CORS *, so the bundle can be imported directly from any page.
name: pages
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:js
      - name: stage _site/
        run: |
          mkdir -p _site/latest
          cp site/index.html _site/index.html
          cp dist/modist.js _site/latest/modist.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4